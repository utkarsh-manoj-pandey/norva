<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141523" />
      <stop offset="50%" stop-color="#0e0f18" />
      <stop offset="100%" stop-color="#08090e" />
    </linearGradient>
    <linearGradient id="topShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="midShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="botShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.09)" stroke-width="3" />
  <circle cx="256" cy="240" r="180" fill="url(#ambientGlow)" />

  <!-- Multi-layered Isometric Sovereign Stack -->
  <g transform="translate(0, 15)">
    <!-- Layer 3: Base -->
    <path d="M 130 280 L 256 348 L 382 280 L 382 312 L 256 380 L 130 312 Z" fill="url(#botShield)" />
    <path d="M 130 312 L 256 380 L 382 312" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

    <!-- Layer 2: Mid-tier -->
    <path d="M 130 210 L 256 278 L 382 210 L 382 242 L 256 310 L 130 242 Z" fill="url(#midShield)" />
    <path d="M 130 242 L 256 310 L 382 242" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2.5" />

    <!-- Layer 1: Top Shield -->
    <g filter="url(#glow)">
      <path d="M 256 95 L 382 165 L 256 235 L 130 165 Z" fill="url(#topShield)" />
    </g>
    <path d="M 256 95 L 382 165 L 256 235 L 130 165 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3" />

    <!-- Inner Core Diamond -->
    <polygon points="256,130 320,165 256,200 192,165" fill="#ffffff" opacity="0.9" />
    <polygon points="256,145 292,165 256,185 220,165" fill="#818cf8" opacity="0.95" />
  </g>
</svg>